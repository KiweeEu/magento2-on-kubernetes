apiVersion: apps/v1
kind: Deployment
metadata:
  name: magento-web
spec:
  selector:
    matchLabels:
      app: magento
      component: web
  template:
    spec:
      containers:
      - name: magento-web
      initContainers:
      - name: wait-for-redis
        image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["/bin/sh"]
        args:
          - -c
          - |
            while ! { echo -e '*1\r\n$4\r\nPING\r\n'; sleep 1; } | nc -w1 $(REDIS_CACHE_HOST) $(REDIS_CACHE_PORT)
            do echo "waiting for $(REDIS_CACHE_HOST)"
            sleep 1
            done
        envFrom:
        - configMapRef:
            name: config
        - configMapRef:
            name: additional


---

apiVersion: batch/v1
kind: Job
metadata:
  name: magento-install
spec:
  template:
    spec:
      containers:
      - name: magento-setup
      initContainers:
      - name: wait-for-redis
        image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["/bin/sh"]
        args:
          - -c
          - |
            while ! { echo -e '*1\r\n$4\r\nPING\r\n'; sleep 1; } | nc -w1 $(REDIS_CACHE_HOST) $(REDIS_CACHE_PORT)
            do echo "waiting for $(REDIS_CACHE_HOST)"
            sleep 1
            done
        envFrom:
        - configMapRef:
            name: config
        - configMapRef:
            name: additional
